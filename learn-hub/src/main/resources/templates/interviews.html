<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{interviews.title}">Interview History</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1 th:text="#{interviews.title}">Interview History</h1>
    <button onclick="location.href='/mypage'" th:text="#{common.mypage}">My Page</button>
</header>

<div class="interview-list-container">
    <div id="interviewList"></div>
    <div id="loading" class="interview-loading" th:text="#{common.loading}">Loading...</div>
</div>

<script src="/js/cursor-paging.js"></script>
<script th:inline="javascript">
    const messages = {
        allLoaded: /*[[#{interviews.all.loaded}]]*/ "All history has been loaded.",
        loadFailed: /*[[#{interviews.load.failed}]]*/ "Failed to load data."
    };
    const mainCategoryLabels = {
        COMPUTER_SCIENCE: /*[[#{mainCategory.computer_science}]]*/ "Computer Science",
        BACKEND: /*[[#{mainCategory.backend}]]*/ "Backend",
        SYSTEM_DESIGN: /*[[#{mainCategory.system_design}]]*/ "System Design",
        CULTURE_FIT: /*[[#{mainCategory.culture_fit}]]*/ "Culture Fit"
    };

    let loading = false;
    let hasNext = true;
    let nextCursor = null;

    const listEl = document.getElementById("interviewList");
    const loadingEl = document.getElementById("loading");

    async function loadInterviews() {
        if (loading || !hasNext) return;
        loading = true;

        try {
            const data = await fetchCursorPage({
                url: "/api/interviews",
                params: { size: 10 },
                cursor: nextCursor,
                credentials: "include"
            });

            data.items.forEach(item => {
                const div = document.createElement("div");
                div.className = "interview-item";
                div.onclick = () => {
                    location.href = `/interviews/${item.id}`;
                };

                div.innerHTML = `
                    <div class="interview-category">${mainCategoryLabels[item.mainCategory] || item.categoryName}</div>
                    <div class="interview-date">${item.endedAt}</div>
                `;
                listEl.appendChild(div);
            });

            hasNext = data.hasNext;
            nextCursor = data.nextCursor;

            if (!hasNext) {
                loadingEl.innerText = messages.allLoaded;
            }
        } catch (err) {
            console.error(err);
            loadingEl.innerText = messages.loadFailed;
        } finally {
            loading = false;
        }
    }

    window.addEventListener("scroll", () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) {
            loadInterviews();
        }
    });

    loadInterviews();
</script>

</body>
</html>

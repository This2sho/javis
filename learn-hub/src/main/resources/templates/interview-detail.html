<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{interview.detail.title}">Interview Detail</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1 th:text="#{interview.detail.title}">Interview Detail</h1>
    <div class="interview-detail-actions">
        <button onclick="location.href='/interviews'" th:text="#{common.list}">List</button>
        <button onclick="location.href='/mypage'" th:text="#{common.mypage}">My Page</button>
    </div>
</header>

<div class="interview-detail-container">
    <div id="qnaContainer"></div>
</div>

<script th:inline="javascript">
    const interviewId = [[${interviewId}]];
    const loadFailedMessage = /*[[#{interview.detail.load.failed}]]*/ "Unable to load the data.";
</script>

<script>
    const container = document.getElementById("qnaContainer");

    fetch(`/api/interviews/${interviewId}`, { credentials: "include" })
        .then(res => res.json())
        .then(data => {
            data.qnAResponses.forEach(qna => {
                const div = document.createElement("div");
                div.className = "qna-card";
                div.innerHTML = `
                    <div class="qna-question">Q. ${qna.question}</div>
                    <div class="qna-answer">A. ${qna.answer}</div>
                    <div class="qna-feedback">${qna.feedBack}</div>
                `;
                container.appendChild(div);
            });
        })
        .catch(err => {
            console.error(err);
            container.innerText = loadFailedMessage;
        });
</script>

</body>
</html>

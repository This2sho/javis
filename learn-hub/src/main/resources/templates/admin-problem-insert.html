<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.problem.insert.title}">Upload Problem JSON</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<main class="page-container">
<h1 th:text="#{admin.problem.insert.heading}">Upload Problem JSON</h1>

<input type="file" id="jsonFileInput" accept=".json"/>

<textarea id="jsonPreview" th:placeholder="#{admin.problem.insert.preview.placeholder}" placeholder="JSON content will be shown here."></textarea>

<br/>
<button onclick="submitProblems()" th:text="#{admin.problem.insert.submit}">Upload Problems to Server</button>

<div id="status" class="status"></div>
</main>

<script th:inline="javascript">
    const fileInput = document.getElementById("jsonFileInput");
    const preview = document.getElementById("jsonPreview");
    const status = document.getElementById("status");
    const messages = {
        loadSuccess: /*[[#{admin.problem.insert.load.success}]]*/ "JSON file loaded successfully",
        parseFailed: /*[[#{admin.problem.insert.parse.failed}]]*/ "Failed to parse JSON",
        invalid: /*[[#{admin.problem.insert.invalid}]]*/ "Upload a valid JSON file first.",
        submitFailed: /*[[#{admin.problem.insert.submit.failed}]]*/ "Failed to register problems",
        processingFailed: /*[[#{admin.problem.insert.processing.failed}]]*/ "An error occurred while processing."
    };

    let parsedJson = null;

    fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (!file) return;

        const reader = new FileReader();

        reader.onload = (e) => {
            try {
                parsedJson = JSON.parse(e.target.result);
                preview.value = JSON.stringify(parsedJson, null, 2);
                status.textContent = messages.loadSuccess;
                status.style.color = "green";
            } catch (error) {
                status.textContent = messages.parseFailed;
                status.style.color = "red";
                parsedJson = null;
            }
        };

        reader.readAsText(file);
    });

    async function submitProblems() {
        if (!parsedJson) {
            alert(messages.invalid);
            return;
        }
        fetch("/admin/api/problems", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(parsedJson)
        })
        .then(res => {
            const location = res.headers.get("Location");
            if (location) {
                window.location.href = location;
                return;
            }

            return res.json();
        })
        .then(data => {
            if (data && data.redirectUrl) {
                window.location.href = data.redirectUrl;
            }
        })
        .catch(err => {
            console.error(err);
            status.textContent = messages.submitFailed;
            status.style.color = "red";
            alert(messages.processingFailed);
        });
    }
</script>

</body>
</html>

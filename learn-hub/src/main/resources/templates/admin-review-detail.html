<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.review.detail.title}">Review Request Detail</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1 th:text="#{admin.review.detail.title}">Review Request Detail</h1>
</header>

<main class="page-container">
    <div id="view-root"></div>

    <div class="page-actions">
        <button class="approve-btn approve" onclick="submitReview('APPROVED')" th:text="#{admin.review.detail.approve}">Approve</button>
        <button class="reject-btn reject" onclick="submitReview('REJECTED')" th:text="#{admin.review.detail.reject}">Reject</button>
    </div>

</main>

<script th:inline="javascript">
    const REVIEW_ID = /*[[${reviewId}]]*/ 0;
    const ROOT_PROBLEM_ID   = /*[[${problemId}]]*/ 0;
    const messages = {
        problemFailed: /*[[#{admin.review.detail.problem.failed}]]*/ "Failed to load the problem.",
        referenceAnswer: /*[[#{admin.review.detail.referenceAnswer}]]*/ "Reference Answer",
        processFailed: /*[[#{admin.review.detail.process.failed}]]*/ "An error occurred while processing the review.",
        difficultyEasy: /*[[#{difficulty.EASY}]]*/ "Easy",
        difficultyMedium: /*[[#{difficulty.MEDIUM}]]*/ "Medium",
        difficultyHard: /*[[#{difficulty.HARD}]]*/ "Hard"
    };
</script>

<script>
    fetch(`/api/problems/${ROOT_PROBLEM_ID}`, { credentials: "include" })
        .then(res => {
            if (!res.ok) throw new Error(messages.problemFailed);
            return res.json();
        })
        .then(problem => {
            const root = document.getElementById("view-root");
            root.innerHTML = "";
            renderView(root, problem, 0);
        });

    function renderView(container, problem, depth) {
        const box = document.createElement("div");
        box.className = "problem-box";
        box.style.marginLeft = `${depth * 24}px`;

        box.innerHTML = `
            <div class="problem-content">${problem.content}</div>

            <div class="problem-meta">
                <span class="tag difficulty">${translateDifficulty(problem.difficulty)}</span>
                <span class="tag category">${problem.category}</span>
            </div>

            <div class="section">
                <h4>${messages.referenceAnswer}</h4>
                <p>${problem.referenceAnswer}</p>
            </div>
        `;

        container.appendChild(box);

        problem.followUps?.forEach(fu =>
            renderView(container, fu, depth + 1)
        );
    }

    function translateDifficulty(difficulty) {
        switch (difficulty) {
            case "EASY":
                return messages.difficultyEasy;
            case "MEDIUM":
                return messages.difficultyMedium;
            case "HARD":
                return messages.difficultyHard;
            default:
                return difficulty;
        }
    }

    function submitReview(status) {
        fetch(`/admin/api/review-requests/${REVIEW_ID}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({
                registrationStatus: status
            })
        })
            .then(res => {
                if (!res.ok) {
                    throw new Error(messages.processFailed);
                }

                const location = res.headers.get("Location");
                if (location) {
                    window.location.href = location;
                    return;
                }

                return res.json();
            })
            .then(data => {
                if (data && data.redirectUrl) {
                    window.location.href = data.redirectUrl;
                }
            })
            .catch(err => {
                console.error(err);
                alert(messages.processFailed);
            });
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.main.title}">Admin - Main</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h1>Admin Console</h1>
    <div>
        <button onclick="location.href='/'" th:text="#{admin.main.home}">Go to Main</button>
    </div>
</header>

<main class="page-container">

    <section class="problem-section">
        <h2 class="section-title">🛠 <span th:text="#{admin.main.section}">Admin Features</span></h2>

        <div class="problem-history-action">
            <button
                    class="problem-history"
                    onclick="location.href='/admin/review-requests'">
                📋 <span th:text="#{admin.main.review.requests}">Manage Review Requests</span>
            </button>
        </div>

        <div class="problem-history-action">
            <button
                    class="problem-history"
                    onclick="location.href='/admin/problem-insert'">
                <span th:text="#{admin.main.problem.insert}">Add Problems</span>
            </button>
        </div>
    </section>

</main>

</body>
</html>

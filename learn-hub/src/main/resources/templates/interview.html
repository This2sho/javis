<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${interviewTitle}">인터뷰</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/chat.css">
</head>
<body class="interview-page">

<main class="interview-page-shell">
    <header class="interview-page-header">
        <div>
            <h2 th:text="${interviewTitle}"></h2>
            <p class="interview-timer-label" th:text="#{interview.timer.tip}">Answer as quickly and clearly as you can.</p>
        </div>
        <div class="interview-timer-card" id="timerCard">
            <span class="interview-timer-title" th:text="#{interview.timer.title}">Answer Time</span>
            <strong class="interview-timer-value" id="answerTimer">00:00</strong>
        </div>
    </header>

    <input type="hidden" th:value="${mainCategory}" id="mainCategory">
    <input type="hidden" value="-1" id="questionId"/>

    <div class="chat-container">
        <div class="messages" id="chatContainer">

            <div class="message bot-message"
                 th:text="${welcomeMessage}">
            </div>
        </div>

        <div class="input-container">
            <textarea id="chatInput"
                      class="chat-input"
                      th:placeholder="#{interview.placeholder}"
                      placeholder="Enter your answer..."></textarea>

            <button class="send-button" id="sendButton">
                <svg viewBox="0 0 24 24">
                    <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
                </svg>
            </button>
        </div>
    </div>
</main>

<script th:inline="javascript">
    const chatInput = document.getElementById("chatInput");
    const chatContainer = document.getElementById("chatContainer");
    const sendButton = document.getElementById("sendButton");
    const mainCategory = document.getElementById("mainCategory").value;
    const messages = {
        resume: /*[[#{interview.resume}]]*/ "Resuming your in-progress interview.",
        pending: /*[[#{interview.pending}]]*/ "Your previous answer is being evaluated. Please wait a moment.",
        preparing: /*[[#{interview.preparing}]]*/ "Preparing the next question. Please wait a moment.",
        startFailed: /*[[#{interview.start.failed}]]*/ "Unable to start the interview due to a network issue.",
        finished: /*[[#{interview.finished}]]*/ "The interview has ended. Good work.",
        timeout: /*[[#{interview.timeout}]]*/ "Evaluation is taking longer than expected. Please try again shortly.",
        serverError: /*[[#{interview.server.error}]]*/ "A server error occurred.",
        loading: /*[[#{interview.loading}]]*/ "Analyzing your answer",
        retry: /*[[#{interview.retry}]]*/ "Retry",
        wsOpen: /*[[#{interview.ws.open}]]*/ "WebSocket connected",
        wsClose: /*[[#{interview.ws.close}]]*/ "WebSocket disconnected",
        wsError: /*[[#{interview.ws.error}]]*/ "WebSocket error:",
        timerMeta: /*[[#{interview.timer.meta('__TIME__')}]]*/ "Answer time: __TIME__"
    };

    let ws = null;
    let loadingMessage = null;
    let memberId = null;
    let evaluationTimeoutId = null;
    let answerStartedAt = null;
    let timerIntervalId = null;
    let lastElapsedMs = 0;

    /* =========================
       페이지 로드 → WebSocket 연결 + 인터뷰 시작
    ========================= */
    document.addEventListener("DOMContentLoaded", () => {
        startInterview();
    });

    function startInterview() {
        lockInput();

        fetch(`/api/interviews/start/${mainCategory}`, {
            method: "POST",
            credentials: "include"
        })
            .then(async res => {
                if (!res.ok) {
                    let errorMessage = messages.startFailed;

                    try {
                        const err = await res.json();
                        errorMessage = err?.message || errorMessage;
                    } catch (parseError) {
                        console.error(parseError);
                    }

                    throw new Error(errorMessage);
                }
                return res.json();
            })
            .then(data => {
                connectWebSocket(data.interviewId);
                if (!data.isFirst) {
                    appendBotMessage(messages.resume);
                }
                if (data.isPendingEvaluation) {
                    appendBotMessage(messages.pending);
                    loadingMessage = appendLoadingMessage();
                    startEvaluationTimeout();
                    return;
                }
                if (!data.question) {
                    appendBotMessage(messages.preparing);
                    loadingMessage = appendLoadingMessage();
                    startEvaluationTimeout();
                    return;
                }
                showQuestion(data.question, data.questionId);
                unlockInput();
            })
            .catch(err => {
                console.error(err);
                alert(err?.message || messages.startFailed);
                window.location.href = "/";
                unlockInput();
            });
    }

    /* =========================
       WebSocket 연결
    ========================= */
    function connectWebSocket(interviewId) {
        const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const wsUrl = `${wsProtocol}//${window.location.host}/ws/interview`;

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            console.log(messages.wsOpen);
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            handleNextQuestion(data);
        };

        ws.onclose = () => {
            console.log(messages.wsClose);
            setTimeout(() => {
                if (interviewId) connectWebSocket(interviewId);
            }, 3000);
        };

        ws.onerror = (error) => {
            console.error(messages.wsError, error);
        };
    }

    /* =========================
       다음 질문 수신 처리
    ========================= */
    function handleNextQuestion(data) {
        clearEvaluationTimeout();

        if (loadingMessage) {
            loadingMessage.remove();
            loadingMessage = null;
        }

        if (data.failed) {
            appendBotMessage(data.interviewerMessage);
            appendRetryButton();
            return;
        }

        if (data.ended) {
            stopAnswerTimer();
            appendBotMessage(messages.finished);
            setTimeout(() => {
                window.location.href = `/interviews/${data.interviewId}`;
            }, 1500);
        } else {
            showQuestion(data.interviewerMessage, data.questionId);
            unlockInput();
        }
    }

    /* =========================
       채점 대기 타임아웃 (3분)
    ========================= */
    function startEvaluationTimeout() {
        evaluationTimeoutId = setTimeout(() => {
            if (loadingMessage) {
                loadingMessage.remove();
                loadingMessage = null;
            }
            appendBotMessage(messages.timeout);
            appendRetryButton();
        }, 180000);
    }

    function clearEvaluationTimeout() {
        if (evaluationTimeoutId) {
            clearTimeout(evaluationTimeoutId);
            evaluationTimeoutId = null;
        }
    }

    /* =========================
       답변 전송 (비동기)
    ========================= */
    function sendMessage() {
        let userAnswer = chatInput.value.replace(/\n+$/, "");
        const questionId = document.getElementById("questionId").value;
        if (!userAnswer.trim()) return;

        const latestQuestion =
            chatContainer.querySelector(".bot-message:last-child")?.innerText;
        const elapsedMs = getCurrentElapsedMs();

        appendUserMessage(userAnswer, elapsedMs);
        stopAnswerTimer();
        resetInput();
        lockInput();

        loadingMessage = appendLoadingMessage();
        startEvaluationTimeout();

        fetch(`/api/questions/${questionId}/answer`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
                problem: latestQuestion,
                userAnswer: userAnswer,
                responseTimeMs: elapsedMs
            })
        })
            .then(res => {
                if (res.status === 202) {
                    console.log("answer submitted, waiting for evaluation...");
                } else {
                    throw new Error("submit failed");
                }
            })
            .catch(err => {
                clearEvaluationTimeout();
                if (loadingMessage) {
                    loadingMessage.remove();
                    loadingMessage = null;
                }
                console.error(err);
                appendBotMessage(messages.serverError);
                unlockInput();
            });
    }

    /* =========================
       UI 헬퍼
    ========================= */
    function appendBotMessage(text) {
        const div = document.createElement("div");
        div.className = "message bot-message";
        div.innerText = text;
        chatContainer.appendChild(div);
        scrollBottom();
    }

    function appendUserMessage(text, elapsedMs = null) {
        const div = document.createElement("div");
        div.className = "message user-message";

        const body = document.createElement("div");
        body.innerText = text;
        div.appendChild(body);

        if (elapsedMs !== null) {
            const meta = document.createElement("div");
            meta.className = "message-meta user-message-meta";
            meta.innerText = messages.timerMeta.replace("__TIME__", formatElapsed(elapsedMs));
            div.appendChild(meta);
        }

        chatContainer.appendChild(div);
        scrollBottom();
    }

    function showQuestion(question, questionId) {
        appendBotMessage(question);
        document.getElementById("questionId").value = questionId;
        startAnswerTimer();
    }

    function startAnswerTimer() {
        stopAnswerTimer(false);
        answerStartedAt = Date.now();
        lastElapsedMs = 0;
        updateAnswerTimer(0);
        timerIntervalId = setInterval(() => {
            updateAnswerTimer(getCurrentElapsedMs());
        }, 1000);
    }

    function stopAnswerTimer(resetClock = false) {
        if (timerIntervalId) {
            clearInterval(timerIntervalId);
            timerIntervalId = null;
        }
        if (answerStartedAt) {
            lastElapsedMs = Date.now() - answerStartedAt;
            updateAnswerTimer(lastElapsedMs);
        } else if (resetClock) {
            updateAnswerTimer(0);
        }
        answerStartedAt = null;
    }

    function getCurrentElapsedMs() {
        if (!answerStartedAt) {
            return lastElapsedMs;
        }
        return Date.now() - answerStartedAt;
    }

    function updateAnswerTimer(elapsedMs) {
        document.getElementById("answerTimer").innerText = formatElapsed(elapsedMs);
    }

    function formatElapsed(elapsedMs) {
        const totalSeconds = Math.max(0, Math.floor(elapsedMs / 1000));
        const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
        const seconds = String(totalSeconds % 60).padStart(2, "0");
        return `${minutes}:${seconds}`;
    }

    function appendLoadingMessage() {
        const div = document.createElement("div");
        div.className = "message bot-message loading";

        const spinner = document.createElement("div");
        spinner.className = "spinner";

        const text = document.createElement("span");
        text.innerText = messages.loading;

        div.appendChild(spinner);
        div.appendChild(text);
        chatContainer.appendChild(div);
        scrollBottom();
        return div;
    }

    function appendRetryButton() {
        const div = document.createElement("div");
        div.className = "message bot-message";

        const btn = document.createElement("button");
        btn.innerText = messages.retry;
        btn.onclick = () => {
            div.remove();
            if (ws) {
                ws.onclose = null;
                ws.close();
                ws = null;
            }
            startInterview();
        };

        div.appendChild(btn);
        chatContainer.appendChild(div);
        scrollBottom();
    }

    function resetInput() {
        chatInput.value = "";
        chatInput.style.height = "40px";
    }

    function lockInput() {
        chatInput.disabled = true;
        sendButton.disabled = true;
    }

    function unlockInput() {
        chatInput.disabled = false;
        sendButton.disabled = false;
        chatInput.focus();
    }

    function scrollBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    /* =========================
       이벤트
    ========================= */
    chatInput.addEventListener("input", () => {
        chatInput.style.height = "auto";
        chatInput.style.height = Math.min(chatInput.scrollHeight, 150) + "px";
    });

    chatInput.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            sendMessage();
        }
    });

    sendButton.addEventListener("click", sendMessage);

    window.addEventListener("beforeunload", () => {
        if (ws) ws.close();
    });
</script>

</body>
</html>

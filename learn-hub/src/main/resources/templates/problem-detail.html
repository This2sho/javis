<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{problem.detail.title}">Problem Detail</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1 th:text="#{problem.detail.title}">Problem Detail</h1>
</header>

<main class="page-container">

    <div id="view-root"></div>

    <div class="page-actions">
        <button class="primary-action" onclick="requestReview()" th:text="#{problem.detail.requestReview}">Request Review</button>
        <button class="primary-action" onclick="enterEditModeAll()" th:text="#{problem.detail.edit}">Edit</button>
        <button class="secondary-btn" onclick="deleteProblem()" th:text="#{problem.detail.delete}">Delete</button>
    </div>

    <div id="edit-mode" style="display:none;">
        <h2 th:text="#{problem.detail.edit.title}">Edit Problem</h2>
        <div id="edit-root"></div>

        <div class="edit-actions">
            <button class="submit-btn" onclick="submitUpdate()" th:text="#{problem.detail.save}">Save Changes</button>
            <button class="secondary-btn" onclick="exitEditMode()" th:text="#{problem.detail.cancel}">Cancel</button>
        </div>
    </div>

</main>

<script th:inline="javascript">
    const ROOT_PROBLEM_ID = /*[[${problemId}]]*/ 0;
    const DIFFICULTIES = /*[[${difficulties}]]*/ [];
    const CATEGORY_TREE = /*[[${categoryTree.categoryNodeResponses}]]*/ [];
    window.problemFormMessages = {
        delete: /*[[#{problem.form.delete}]]*/ "Delete",
        content: /*[[#{problem.form.content}]]*/ "Question",
        referenceAnswer: /*[[#{problem.form.referenceAnswer}]]*/ "Reference Answer",
        difficulty: /*[[#{problem.form.difficulty}]]*/ "Difficulty",
        category: /*[[#{problem.form.category}]]*/ "Select Category",
        categoryUnselected: /*[[#{problem.form.category.unselected}]]*/ "Not selected",
        addFollowUp: /*[[#{problem.form.addFollowUp}]]*/ "Add Follow-up Question"
    };
    window.difficultyLabels = {
        EASY: /*[[#{difficulty.EASY}]]*/ "Easy",
        MEDIUM: /*[[#{difficulty.MEDIUM}]]*/ "Medium",
        HARD: /*[[#{difficulty.HARD}]]*/ "Hard"
    };
    const pageMessages = {
        referenceAnswer: /*[[#{problem.detail.referenceAnswer}]]*/ "Reference Answer",
        updateFailed: /*[[#{problem.detail.update.failed}]]*/ "Failed to update the problem.",
        deleteConfirm: /*[[#{problem.detail.delete.confirm}]]*/ "This will delete this problem and all follow-up problems. Continue?",
        deleteFailed: /*[[#{problem.detail.delete.failed}]]*/ "Failed to delete the problem."
    };
</script>

<script src="/js/problem-form.js"></script>

<script>
    let ROOT_RESPONSE = null;
    let deletedProblemIds = [];

    function trackDeletedProblem(id) {
        if (id && !deletedProblemIds.includes(id)) {
            deletedProblemIds.push(id);
        }
    }

    /* ===============================
       상세 조회
    =============================== */
    fetch(`/api/problems/${ROOT_PROBLEM_ID}`, { credentials: "include" })
        .then(res => res.json())
        .then(problem => {
            ROOT_RESPONSE = problem;
            const root = document.getElementById("view-root");
            root.innerHTML = "";
            renderView(root, problem, 0);
        });

    function renderView(container, problem, depth) {
        const box = document.createElement("div");
        box.className = "problem-box";
        box.style.marginLeft = `${depth * 24}px`;

        box.innerHTML = `
            <div class="problem-content">${problem.content}</div>
            <div class="problem-meta">
                <span class="tag difficulty">${window.difficultyLabels[problem.difficulty] || problem.difficulty}</span>
                <span class="tag category">${problem.category}</span>
            </div>
            <div class="section">
                <h4>${pageMessages.referenceAnswer}</h4>
                <p>${problem.referenceAnswer}</p>
            </div>
        `;

        container.appendChild(box);
        problem.followUps?.forEach(fu => renderView(container, fu, depth + 1));
    }

    /* ===============================
       수정 모드
    =============================== */
    function enterEditModeAll() {
        document.getElementById("view-root").style.display = "none";
        document.querySelector(".page-actions").style.display = "none";
        document.getElementById("edit-mode").style.display = "block";

        deletedProblemIds = [];

        const editRoot = document.getElementById("edit-root");
        editRoot.innerHTML = "";

        const rootNode = createProblemNode(ROOT_RESPONSE.category, false);
        rootNode.dataset.root = "true";
        ensureHiddenId(rootNode);

        editRoot.appendChild(rootNode);
        fillEditTree(rootNode, ROOT_RESPONSE, false);
    }

    function fillEditTree(node, problem, isFollowUp = false) {
        node.dataset.problemId = problem.id;

        node.querySelector('[data-field="content"]').value = problem.content;
        node.querySelector('[data-field="expectedAnswer"]').value = problem.referenceAnswer;
        node.querySelector('[data-field="difficulty"]').value = problem.difficulty;
        node.querySelector('[data-field="category"]').value = problem.category;

        selectDifficulty(node, problem.difficulty);

        if (!problem.followUps) return;

        const children = node.querySelector(":scope > .children");
        problem.followUps.forEach(fu => {
            const child = createProblemNode(fu.category, true);
            children.appendChild(child);
            fillEditTree(child, fu, true);
        });
    }


    function ensureHiddenId(node) {
        if (!node.querySelector('[data-field="id"]')) {
            const input = document.createElement("input");
            input.type = "hidden";
            input.setAttribute("data-field", "id");
            node.appendChild(input);
        }
    }

    function selectDifficulty(node, difficulty) {
        node.querySelectorAll(".difficulty-btn").forEach(btn => {
            btn.classList.toggle("selected", btn.dataset.value === difficulty);
        });
        node.querySelector('[data-field="difficulty"]').value = difficulty;
    }

    function exitEditMode() {
        document.getElementById("edit-mode").style.display = "none";
        document.getElementById("view-root").style.display = "block";
        document.querySelector(".page-actions").style.display = "block";
        document.getElementById("edit-root").innerHTML = "";
    }

    function submitUpdate() {
        const rootBox = document.querySelector(
            '#edit-root > .problem-box[data-root="true"]'
        );

        const payload = collectProblemNode(rootBox);
        payload.deletedProblemIds = deletedProblemIds;

        fetch(`/api/problems/${ROOT_PROBLEM_ID}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify(payload)
        }).then(res => {
            if (!res.ok) throw new Error(pageMessages.updateFailed);
            location.reload();
        }).catch(() => alert(pageMessages.updateFailed));
    }

    function requestReview() {
        fetch(`/api/problems/${ROOT_PROBLEM_ID}/review-requests`, {
            method: "POST",
            credentials: "include"
        }).then(res => {
            const location = res.headers.get("Location");
            if (location) window.location.href = location;
        });
    }

    function deleteProblem() {
        const confirmed = window.confirm(pageMessages.deleteConfirm);
        if (!confirmed) return;

        fetch(`/api/problems/${ROOT_PROBLEM_ID}`, {
            method: "DELETE",
            credentials: "include"
        }).then(res => {
            if (!res.ok) throw new Error(pageMessages.deleteFailed);
            window.location.href = "/problems";
        }).catch(() => alert(pageMessages.deleteFailed));
    }
</script>

</body>
</html>

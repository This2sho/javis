<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.review.requests.title}">Review Requests</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1 th:text="#{admin.review.requests.title}">Review Requests</h1>

    <div style="margin-top:12px;">
        <select id="status-select">
            <option value="PENDING_REVIEW" selected th:text="#{review.status.PENDING_REVIEW}">Pending</option>
            <option value="APPROVED" th:text="#{review.status.APPROVED}">Approved</option>
            <option value="REJECTED" th:text="#{review.status.REJECTED}">Rejected</option>
        </select>
    </div>
</header>

<main class="page-container">
    <div id="review-list" class="problem-list"></div>
</main>

<script src="/js/cursor-paging.js"></script>
<script th:inline="javascript">
    const messages = {
        loadFailed: /*[[#{admin.review.requests.load.failed}]]*/ "Unable to load review requests.",
        empty: /*[[#{admin.review.requests.empty}]]*/ "No review requests."
    };
    const reviewStatusLabels = {
        PENDING_REVIEW: /*[[#{review.status.PENDING_REVIEW}]]*/ "Pending",
        APPROVED: /*[[#{review.status.APPROVED}]]*/ "Approved",
        REJECTED: /*[[#{review.status.REJECTED}]]*/ "Rejected"
    };

    const list = document.getElementById("review-list");

    let cursor = null;     // CursorResponse
    let hasNext = true;
    let currentStatus = "PENDING_REVIEW";

    const statusSelect = document.getElementById("status-select");

    statusSelect.addEventListener("change", () => {
        currentStatus = statusSelect.value;

        // 🔥 상태 바뀌면 전부 초기화
        cursor = null;
        hasNext = true;
        list.innerHTML = "";

        loadReviews();
    });

    /* ===============================
       데이터 로딩
    =============================== */
    async function loadReviews() {
        if (!hasNext) return;

        try {
            const page = await fetchCursorPage({
                url: "/admin/api/review-requests",
                params: {
                    registrationStatus: currentStatus
                },
                cursor
            });

            renderReviews(page.items);

            cursor = page.nextCursor;   // 🔥 서버가 내려준 커서 그대로 사용
            hasNext = page.hasNext;

        } catch (e) {
            console.error(e);
            alert(messages.loadFailed);
        }
    }

    /* ===============================
       렌더링
    =============================== */
    function renderReviews(reviews) {
        if (!reviews || reviews.length === 0) {
            if (list.children.length === 0) {
                list.innerHTML =
                    `<p style="text-align:center;">${messages.empty}</p>`;
            }
            return;
        }

        reviews.forEach(r => {
            const card = document.createElement("div");
            card.className = "problem-card";

            // 클릭 → 문제 상세
            card.onclick = () => {
                location.href = `/admin/review-requests/${r.id}`;
            };

            card.innerHTML = `
                <div class="problem-content">
                    ${r.rootProblem}
                </div>
                <div class="problem-meta">
                    <span class="tag review-status">${reviewStatusLabels[r.registrationStatus] || r.registrationStatus}</span>
                </div>
            `;

            list.appendChild(card);
        });
    }

    /* ===============================
       무한 스크롤
    =============================== */
    window.addEventListener("scroll", () => {
        if (
            window.innerHeight + window.scrollY >=
            document.body.offsetHeight - 200
        ) {
            loadReviews();
        }
    });

    loadReviews();
</script>

</body>
</html>

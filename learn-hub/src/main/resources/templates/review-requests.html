<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{review.requests.title}">Review Requests</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1 th:text="#{review.requests.title}">Review Requests</h1>
    <div class="header-actions">
        <button class="problem-addition-action"
                onclick="location.href='/problems'"
                th:text="#{review.requests.back}">Back to Problems</button>
    </div>
</header>

<main class="page-container">
    <div id="review-list" class="problem-list"></div>
</main>

<script src="/js/cursor-paging.js"></script>
<script th:inline="javascript">
    const messages = {
        loadFailed: /*[[#{review.requests.load.failed}]]*/ "Unable to load review requests.",
        empty: /*[[#{review.requests.empty}]]*/ "No review requests."
    };
    const reviewStatusLabels = {
        PENDING_REVIEW: /*[[#{review.status.PENDING_REVIEW}]]*/ "Pending",
        APPROVED: /*[[#{review.status.APPROVED}]]*/ "Approved",
        REJECTED: /*[[#{review.status.REJECTED}]]*/ "Rejected"
    };

    const list = document.getElementById("review-list");

    let cursor = null;     // CursorResponse
    let hasNext = true;

    /* ===============================
       데이터 로딩
    =============================== */
    async function loadReviews() {
        if (!hasNext) return;

        try {
            const page = await fetchCursorPage({
                url: "/api/review-requests",
                cursor
            });

            renderReviews(page.items);

            cursor = page.nextCursor;   // 🔥 서버가 내려준 커서 그대로 사용
            hasNext = page.hasNext;

        } catch (e) {
            console.error(e);
            alert(messages.loadFailed);
        }
    }

    /* ===============================
       렌더링
    =============================== */
    function renderReviews(reviews) {
        if (!reviews || reviews.length === 0) {
            if (list.children.length === 0) {
                list.innerHTML =
                    `<p style="text-align:center;">${messages.empty}</p>`;
            }
            return;
        }

        reviews.forEach(r => {
            const card = document.createElement("div");
            card.className = "problem-card";

            // 클릭 → 문제 상세
            card.onclick = () => {
                location.href = `/problems/${r.problemId}`;
            };

            card.innerHTML = `
                <div class="problem-content">
                    ${r.rootProblem}
                </div>
                <div class="problem-meta">
                    <span class="tag review-status">${reviewStatusLabels[r.registrationStatus] || r.registrationStatus}</span>
                </div>
            `;

            list.appendChild(card);
        });
    }

    window.addEventListener("scroll", () => {
        if (
            window.innerHeight + window.scrollY >=
            document.body.offsetHeight - 200
        ) {
            loadReviews();
        }
    });

    loadReviews();
</script>

</body>
</html>

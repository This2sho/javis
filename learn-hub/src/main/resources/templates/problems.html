<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{problems.title}">Problem History</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1 th:text="#{problems.title}">Problem History</h1>
    <div class="header-actions">
        <button class="problem-addition-action"
                onclick="location.href='/review-requests'"
                th:text="#{problems.review.requests}">View Review Status</button>

        <button class="problem-addition-action"
                onclick="location.href='/problems/new'"
                th:text="#{problems.new}">+ New Problem</button>
    </div>
</header>

<main class="page-container">
    <div id="problem-list" class="problem-list"></div>
    <div id="loading" class="interview-loading" th:text="#{common.loading}">Loading...</div>
</main>

<script src="/js/problem-form.js"></script>
<script src="/js/cursor-paging.js"></script>
<script th:inline="javascript">
    const messages = {
        allLoaded: /*[[#{problems.all.loaded}]]*/ "All problems have been loaded.",
        loadFailed: /*[[#{problems.load.failed}]]*/ "Failed to load"
    };

    let loading = false;
    let hasNext = true;
    let nextCursor = null;

    const listEl = document.getElementById("problem-list");
    const loadingEl = document.getElementById("loading");

    async function loadProblems() {
        if (loading || !hasNext) return;
        loading = true;

        try {
            const data = await fetchCursorPage({
                url: "/api/problems",
                params: { size: 10 },
                cursor: nextCursor,
                credentials: "include"
            });

            renderProblems(data.items);

            hasNext = data.hasNext;
            nextCursor = data.nextCursor;

            if (!hasNext) {
                loadingEl.innerText = messages.allLoaded;
            }
        } catch (e) {
            console.error(e);
            loadingEl.innerText = messages.loadFailed;
        } finally {
            loading = false;
        }
    }

    function renderProblems(problems) {
        problems.forEach(p => {
            const card = document.createElement("div");
            card.className = "problem-card";
            card.onclick = () => location.href = `/problems/${p.id}`;

            card.innerHTML = `
                <div class="problem-content">${p.content}</div>
                <div class="problem-meta">
                    <span class="tag difficulty">${p.difficulty}</span>
                    <span class="tag category">${p.category}</span>
                </div>
            `;

            listEl.appendChild(card);
        });
    }

    window.addEventListener("scroll", () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) {
            loadProblems();
        }
    });

    loadProblems();
</script>

</body>
</html>

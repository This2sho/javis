<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{login.success.title}">Login Success</title></head>
<body>
<h2 th:text="#{login.success.heading}">Login Success</h2>
<script th:inline="javascript">
    const accessToken = /*[[${accessToken}]]*/ "";
    const provider = /*[[${provider}]]*/ "";
    const loginProcessingFailed = /*[[#{login.success.failed}]]*/ "Login processing failed";

    fetch(`/login/${provider.toLowerCase()}`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ accessToken })
    })
        .then(data => {
            window.location.href = "/";
        })
        .catch(err => {
            console.error(loginProcessingFailed, err);
            window.location.href = "/error";
        });
</script>
</body>
</html>

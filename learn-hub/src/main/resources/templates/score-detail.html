<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{score.detail.title}">Category Scores</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1 id="pageTitle" th:text="#{score.detail.title}">Category Scores</h1>
    <button onclick="goBack()" th:text="#{common.back}">Back</button>
</header>

<input type="hidden" th:value="${mainCategory}" id="mainCategory">

<main class="chart-container">
    <div class="chart-title" id="chartTitle"></div>
    <div id="chart"></div>
</main>

<script th:inline="javascript">
    let rootNode = null;
    let nodeStack = [];
    const mainCategory = document.getElementById("mainCategory").value;
    const messages = {
        loadFailed: /*[[#{score.detail.load.failed}]]*/ "Unable to load score information.",
        noChildren: /*[[#{score.detail.no.children}]]*/ "No subcategories.",
        scoreUnit: /*[[#{common.score.unit}]]*/ "pts",
        mainCategorySuffixTemplate: /*[[#{score.detail.suffix('__NAME__')}]]*/ "__NAME__ Score"
    };
    const mainCategoryLabelsByPath = {
        computer_science: /*[[#{mainCategory.computer_science}]]*/ "Computer Science",
        backend: /*[[#{mainCategory.backend}]]*/ "Backend",
        system_design: /*[[#{mainCategory.system_design}]]*/ "System Design",
        culture_fit: /*[[#{mainCategory.culture_fit}]]*/ "Culture Fit"
    };

    document.addEventListener("DOMContentLoaded", () => {
        loadScoreTree();
    });

    function loadScoreTree() {
        fetch(`/api/scores/${mainCategory}`, {
            method: "GET",
            credentials: "include"
        })
            .then(res => res.json())
            .then(data => {
                rootNode = data;
                nodeStack = [rootNode];
                renderCurrentLevel();
            })
            .catch(() => alert(messages.loadFailed));
    }

    function renderCurrentLevel() {
        const currentNode = nodeStack[nodeStack.length - 1];
        const children = currentNode.children;
        const currentLabel = displayCategoryName(currentNode.categoryName);

        document.getElementById("chartTitle").innerText =
            messages.mainCategorySuffixTemplate.replace("__NAME__", currentLabel);

        const chart = document.getElementById("chart");
        chart.innerHTML = "";

        if (!children || children.length === 0) {
            chart.innerHTML = `<p>${messages.noChildren}</p>`;
            return;
        }

        const maxScore = Math.max(...children.map(c => c.score), 1);

        children.forEach(child => {
            const row = document.createElement("div");
            row.className = "bar-row";

            if (child.children && child.children.length > 0) {
                row.style.cursor = "pointer";
                row.addEventListener("click", () => {
                    nodeStack.push(child);
                    renderCurrentLevel();
                });
            }

            const label = document.createElement("div");
            label.className = "bar-label";
            label.innerText = displayCategoryName(child.categoryName);

            const wrapper = document.createElement("div");
            wrapper.className = "bar-wrapper";

            const bar = document.createElement("div");
            bar.className = "bar";
            bar.style.width = (child.score / maxScore * 100) + "%";

            const score = document.createElement("div");
            score.className = "bar-score";
            score.innerText = `${child.score}${messages.scoreUnit}`;

            wrapper.appendChild(bar);
            row.appendChild(label);
            row.appendChild(wrapper);
            row.appendChild(score);
            chart.appendChild(row);
        });
    }

    function displayCategoryName(categoryName) {
        return mainCategoryLabelsByPath[categoryName] || categoryName;
    }

    function goBack() {
        if (nodeStack.length > 1) {
            nodeStack.pop();
            renderCurrentLevel();
        } else {
            history.back();
        }
    }
</script>

</body>
</html>

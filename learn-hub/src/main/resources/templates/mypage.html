<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{mypage.title}">My Page</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
    <h1 th:text="#{mypage.title}">My Page</h1>
    <button onclick="location.href='/'" th:text="#{common.home}">Home</button>
</header>

<main class="score-list">
    <div class="score-list-title" th:text="#{mypage.score.list}">Scores by Category</div>
    <div id="scoreList"></div>
</main>
<main class="score-list">
    <button class="interview-list-button" onclick="location.href='/interviews'" th:text="#{mypage.interview.history}">View Interview History</button>
</main>

<script th:inline="javascript">
    const messages = {
        loadFailed: /*[[#{mypage.load.failed}]]*/ "Unable to load score information.",
        scoreUnit: /*[[#{common.score.unit}]]*/ "pts"
    };
    const mainCategoryLabels = {
        COMPUTER_SCIENCE: /*[[#{mainCategory.computer_science}]]*/ "Computer Science",
        BACKEND: /*[[#{mainCategory.backend}]]*/ "Backend",
        SYSTEM_DESIGN: /*[[#{mainCategory.system_design}]]*/ "System Design",
        CULTURE_FIT: /*[[#{mainCategory.culture_fit}]]*/ "Culture Fit"
    };

    document.addEventListener("DOMContentLoaded", () => {
        loadScores();
    });

    function loadScores() {
        fetch("/api/scores", {
            method: "GET",
            credentials: "include"
        })
            .then(res => res.json())
            .then(data => renderScores(data.scores))
            .catch(() => alert(messages.loadFailed));
    }

    function renderScores(scores) {
        const container = document.getElementById("scoreList");
        container.innerHTML = "";

        scores.forEach(item => {
            const div = document.createElement("div");
            div.className = "score-item";

            const name = document.createElement("div");
            name.className = "score-item-name";
            name.innerText = mainCategoryLabels[item.mainCategory] || item.mainCategory;

            const score = document.createElement("div");
            score.className = "score-item-value";
            score.innerText = `${item.score}${messages.scoreUnit}`;

            div.appendChild(name);
            div.appendChild(score);

            div.addEventListener("click", () => {
                location.href = `/scores/${item.mainCategory}`;
            });

            container.appendChild(div);
        });
    }
</script>

</body>
</html>

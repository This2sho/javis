x-common-environment: &common_environment
  TZ: Asia/Seoul

  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

  # JWT / OAuth
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
  KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
  KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}

  # GEMINI
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME}

services:
  # =====================
  # PROD MySQL
  # =====================
  learn-hub-mysql-prod:
    image: mysql:8.4
    container_name: learn-hub-mysql-prod
    profiles: ["prod"]
    networks:
      - javis-net
    environment:
      MYSQL_DATABASE: learn_hub
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-prod-volume:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # =====================
  # TEST MySQL
  # =====================
  learn-hub-mysql-test:
    image: mysql:8.4
    container_name: learn-hub-mysql-test
    profiles: ["test"]
    networks:
      - javis-net
    environment:
      MYSQL_DATABASE: learn_hub_test
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-test-volume:/var/lib/mysql
#      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  # =====================
  # PROD Spring Backend
  # =====================
  learn-hub-backend-prod:
    image: leegeonho/learn-hub-backend:0.1.6
    container_name: learn-hub-backend-prod
    profiles: ["prod"]
    networks:
      - javis-net
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://learn-hub-mysql-prod:3306/learn_hub?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Seoul
      <<: *common_environment
    depends_on:
      learn-hub-mysql-prod:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: on-failure

  # =====================
  # TEST Spring Backend
  # =====================
  learn-hub-backend-test:
    image: leegeonho/learn-hub-backend:0.1.6
    container_name: learn-hub-backend-test
    profiles: ["test"]
    networks:
      - javis-net
    environment:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:mysql://learn-hub-mysql-test:3306/learn_hub_test?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Seoul
      JAVA_OPTS: >
        -Xms512m
        -Xmx2g
        -Xlog:gc*,gc+heap=info:file=/logs/gc.log:time,uptime,level,tags
      <<: *common_environment
    depends_on:
      learn-hub-mysql-test:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: on-failure
    volumes:
      - ./logs:/logs

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    profiles: ["test"]
    networks:
      - javis-net
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: on-failure

  grafana:
    image: grafana/grafana:11.1.5
    container_name: grafana
    profiles: ["test"]
    networks:
      - javis-net
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-volume:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: on-failure

networks:
  javis-net:
    name: javis-net
    driver: bridge

volumes:
  mysql-prod-volume:
  mysql-test-volume:
  grafana-volume:
